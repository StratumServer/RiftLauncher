sonar.projectKey=StratumServer_RiftLauncher
sonar.organization=stratumserver

sonar.sourceEncoding=UTF-8

sonar.sources=src
sonar.tests=tests

sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.exclusions=out/**,dist/**,resources/**,docs/**,tests/fixtures/**

# Mirrors the vitest coverage ratchet (vitest.config.ts): presentation files
# (pages, components, App.tsx, main.tsx, i18n.ts) are excluded from the line-
# coverage gate there because DOM behavior, not JSX line count, is the signal.
# Keeping the exclusion in sync here stops Sonar's coverage metric from
# telling a different story than the one we actually gate CI on.
sonar.coverage.exclusions=src/renderer/src/**/pages/**,src/renderer/src/**/components/**,src/renderer/src/App.tsx,src/renderer/src/main.tsx,src/renderer/src/i18n.ts
