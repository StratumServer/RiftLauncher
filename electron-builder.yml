# Stratum identity (issue #16): a different NSIS identity than the archived
# VS Launcher, so installing RiftLauncher never overwrites or uninstalls an
# existing VS Launcher setup. User data continuity is handled separately by
# the userData pin in src/main/index.ts, which is appId-independent.
appId: net.stratumserver.riftlauncher
productName: RiftLauncher
directories:
  buildResources: build
files:
  - "!**/.vscode/*"
  - "!src/*"
  - "!electron.vite.config.{js,ts,mjs,cjs}"
  - "!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}"
  - "!{.env,.env.*,.npmrc,pnpm-lock.yaml}"
  - "!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}"
  # npm installs both @napi-rs/lzma linux binaries on a glibc runner: the
  # committed package-lock.json predates npm recording the `libc` field that
  # would filter the musl builds out, so `npm ci` resolves them on os and cpu
  # alone. Every linux target below (AppImage, deb, rpm, pacman) is glibc, so
  # the musl binary is 1.4 MB that can never load. Revisit if a musl target
  # is ever added.
  - "!node_modules/@napi-rs/lzma-*-musl{,/**/*}"
  # asarUnpack below unpacks every file under resources/ on every platform, but
  # only resources/icon.png is loaded at runtime (src/main/index.ts, `?asset`).
  # icon.ico is still needed at build time: win.icon and nsis.installerIcon
  # point at it below, and electron-builder resolves that path from the
  # project directory before this files list is even consulted, so excluding
  # it here only drops the copy that would otherwise sit unused in the
  # installed app. icon.icns is not referenced anywhere in this config (no
  # mac.icon key is set, so a mac build falls back to Electron's own default
  # icon), so it ships purely as unused asarUnpack weight today.
  - "!resources/icon.icns"
  - "!resources/icon.ico"
  # Nothing under these trees is reachable from out/: docs/ is linked from the
  # app as GitHub URLs rather than read locally (InfoAndHelpPage.tsx), branding/
  # holds design sources including a multi-MB PSD, and tests/ and coverage/ are
  # development artifacts. coverage/ only exists when a developer ran
  # test:coverage before building, so leaving it in made the asar differ
  # between a local build and CI. Source maps inside bundled dependencies ship
  # ~3 MB that no runtime consumes.
  - "!docs{,/**/*}"
  - "!branding{,/**/*}"
  - "!tests{,/**/*}"
  - "!coverage{,/**/*}"
  - "!node_modules/**/*.map"
  # scripts/ contains dev/test helpers (fix-native-deps.js,
  # measure-windows-runtime.ps1) that are never imported from out/. Shipping
  # them adds dead weight to the asar.
  - "!scripts{,/**/*}"
# Chromium ships 55 locale .pak files (~47 MB) and this app can use exactly one.
# The 14 UI languages are React + i18next JSON inside the asar
# (src/renderer/src/locales); these .pak files only feed Chromium's own native
# surfaces, and the launcher exposes none of them: no context menu anywhere
# (src/main/index.ts), spellcheck off plus setSpellCheckerLanguages([]), file
# pickers are native OS dialogs, no <input type=file> in the renderer, and i18n
# is pinned to lng/fallbackLng "en-US" behind a manual in-app selector, so
# app.getLocale() is never consulted. The only residual is Chromium's built-in
# network-error page, which renders in English. If a context menu, a
# spellchecker, or an <input type=file> is ever added, its native strings are
# English-only until this list grows.
#
# The value must be the exact tag "en-US". app-builder-lib matches a pak with
# `wanted === lang || wanted.startsWith(lang + "-")` (ElectronFramework, in
# removeUnusedLanguagesIfNeeded), so the wanted tag is the prefix side and "en"
# does NOT match en-US.pak: it would delete every pak and leave Chromium with
# no locale data, silently, since the "no locales found" warning only fires
# when nothing was deleted. tests/config/electron-builder-locales.test.ts pins
# the value. On macOS the same "en-US" keeps en.lproj via the prefix rule.
electronLanguages:
  - en-US
asarUnpack:
  - resources/**
  - node_modules/@napi-rs/lzma-*/**
win:
  executableName: RiftLauncher
  icon: resources/icon.ico
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: true
  createStartMenuShortcut: true
  allowToChangeInstallationDirectory: true
  installerIcon: resources/icon.ico
  oneClick: false
  runAfterFinish: true
mac:
  # entitlementsInherit points at build/entitlements.mac.plist, which has never
  # existed in git history. build-macos in CI only ever runs build:unpack:no-typecheck
  # (electron-builder --dir, unsigned, entitlements never consulted); build:mac
  # (electron-builder --mac) is the only script that would hit the missing
  # file, and nobody runs it from CI today. Left open rather than guessed at:
  # either add the plist or drop entitlementsInherit and notarize below, a
  # maintainer's call on codesigning intent, not a debt cleanup.
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - deb
    - rpm
    - pacman
  maintainer: Zaldaryon
  category: Game
  icon: build/icons
appImage:
  artifactName: ${name}-${version}.${ext}
deb:
  artifactName: ${name}-${version}.${ext}
  # Spelled out rather than left to electron-builder's defaults, which this list otherwise
  # reproduces exactly (app-builder-lib, FpmTarget.getDefaultDepends). libsecret-1-0 is the reason:
  # Electron's safeStorage reaches the session keyring through it, and with nothing answering, it
  # falls back to a store whose key ships in the binary, which the account store refuses
  # (src/ipc/accountStore.ts). A default is a thing that can change under us; this one decides
  # whether a login can be remembered at all (#481), so it is declared here.
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
  # libappindicator3-1 is electron-builder's own default recommends and is kept; declaring this key
  # replaces the list rather than adding to it. gnome-keyring is the daemon behind libsecret, and it
  # is a recommends rather than a depends on purpose: a KDE session has KWallet answering the same
  # interface, and pulling GNOME Keyring onto it would install the wrong daemon for that desktop. A
  # desktop with neither gets one that works, and anyone who wants neither can still refuse it.
  recommends:
    - libappindicator3-1
    - gnome-keyring
rpm:
  # electron-builder's rpm defaults, which do not carry libsecret, plus libsecret. Same list
  # replacement rule as the deb above, so the defaults are repeated here to keep them.
  # gnome-keyring is not here: electron-builder has no weak-dependency key for rpm, so it cannot be
  # a Recommends the way it is for the deb, and a hard Requires would be the wrong daemon on a KDE
  # spin. The keyring section of docs/get-started/installation/linux.md carries it instead.
  depends:
    - gtk3
    - libnotify
    - nss
    - libXScrnSaver
    - "(libXtst or libXtst6)"
    - xdg-utils
    - at-spi2-core
    - "(libuuid or libuuid1)"
    - libsecret
npmRebuild: false
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  loadBrowserProcessSpecificV8Snapshot: false
  grantFileProtocolExtraPrivileges: false
publish:
  provider: github
  owner: StratumServer
  repo: RiftLauncher
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
