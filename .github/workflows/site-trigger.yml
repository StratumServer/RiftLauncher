name: Website trigger

# Tells the website repository to rebuild when something it renders has changed here: a published
# release, a docs or privacy change landing on dev, or a move on the backgrounds branch. The site
# has no schedule of its own, so these events are what keep it current.
#
# Needs the SITE_TRIGGER_TOKEN secret: a fine-grained personal access token scoped to the
# StratumServer/RiftLauncherWebsite repository with Actions read-and-write. Until the secret
# exists, runs end early and quietly.
on:
  release:
    types: [published, edited]
  push:
    branches: [dev, backgrounds]

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Dispatch the website rebuild
        env:
          TOKEN: ${{ secrets.SITE_TRIGGER_TOKEN }}
        run: |
          # On dev, only changes the site renders are worth a dispatch; the backgrounds branch and
          # releases always are.
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_name }}" = "dev" ]; then
            if ! git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" 2>/dev/null | grep -qE "^(docs/|PRIVACY\.md|branding/)"; then
              echo "No rendered-content change on dev; nothing dispatched."
              exit 0
            fi
          fi
          if [ -z "$TOKEN" ]; then
            echo "SITE_TRIGGER_TOKEN is not set; nothing dispatched."
            exit 0
          fi
          curl -sf -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/StratumServer/RiftLauncherWebsite/dispatches \
            -d '{"event_type": "source-updated"}'
