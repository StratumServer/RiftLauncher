name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

jobs:
  # typecheck and lint run tsc, eslint and prettier. None of them launches
  # Electron, so neither job needs the platform binary that `npm ci`'s
  # postinstall would otherwise fetch from the download mirror. Skipping it
  # means a mirror hiccup can no longer fail a job whose only work is static
  # analysis (issue #377). The test-matrix and build jobs keep the download.
  typecheck:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  lint:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint:ci
      - run: npm run format:check

  test-matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      # Only the ubuntu leg's report is kept: sonarcloud below reads it instead of
      # regenerating its own, which used to duplicate this same step standalone.
      - if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-ubuntu
          path: coverage/
          retention-days: 1

  # `dev` branch protection requires a context literally named `test`, and a
  # matrixed job can't produce one: it reports `test (ubuntu-latest)` and
  # `test (windows-latest)` instead. This job keeps the required name alive.
  # `always()` makes it run even when a leg fails (without it the gate would be
  # skipped, and protection counts a skipped required job as satisfied), and
  # the explicit comparison fails the gate unless every leg succeeded, so a
  # failed, cancelled or skipped matrix turns it red.
  test:
    needs: [test-matrix]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "test-matrix result: ${{ needs.test-matrix.result }}"
          [ "${{ needs.test-matrix.result }}" = "success" ]

  # Informational quality scan: never blocks a merge, so a SonarCloud outage
  # or configuration change can't turn the whole run red.
  # Dependabot events carry no secrets so the scan cannot authenticate.
  #
  # Reads test-matrix's ubuntu coverage artifact rather than running
  # npm run test:coverage a second time in this job, which used to duplicate
  # the identical step test-matrix (ubuntu-latest) already ran. needs:
  # [test-matrix] means this only runs once every matrix leg has succeeded,
  # and only within the same workflow run that produced the artifact: a solo
  # re-run of test-matrix (rather than the whole workflow) produces a fresh
  # coverage report that this job will not automatically pick back up, so
  # re-run sonarcloud too whenever test-matrix is re-run on its own.
  sonarcloud:
    needs: [test-matrix]
    if: (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && (github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]')
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: coverage-ubuntu
          path: coverage/
      - uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # build:unpack:no-typecheck skips the typecheck npm run build (and so
  # build:unpack) does on its way to electron-vite build: the standalone
  # typecheck job above already gates this same commit, so redoing it here
  # only cost time, on both matrix legs and, when build-macos runs, at its
  # 10x billing multiplier.
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:unpack:no-typecheck

  # macos-latest bills Actions minutes at a 10x multiplier and the launcher
  # can't launch the game on macOS yet, so this build is manual-only.
  build-macos:
    if: github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        os: [macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:unpack:no-typecheck
